# OneDrive configuration file
# See: https://github.com/abraunegg/onedrive/blob/master/docs/application-config-options.md

# The directory where files will be synced
sync_dir = "~/OneDrive"

# Number of worker threads for uploads/downloads
threads = 8

# Upload worker threads
upload_threads = 4

# Download worker threads
download_threads = 4

# Skip dot files and folders from synchronization
skip_dotfiles = "false"

# Sync files in the root of the OneDrive directory
sync_root_files = "false"

# Enable client logging
enable_logging = "true"

# Log frequency in seconds
log_frequency = 14400

# Monitor interval in seconds
monitor_interval = "300"

# Minimum number of remote changes before notifying
min_notify_changes = 5

# Directory to skip during synchronization
skip_dir = "~/.local/share/onedrive"

# Files to skip during synchronization
skip_file = "~*.tmp"

# Use device code OAuth flow
use_device_auth = "false"

# Verbose log output
verbose = "false"
